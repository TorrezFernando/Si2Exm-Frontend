<div class="content-area" style="max-width: 1200px; margin: 0 auto;">
  <div class="flex items-center justify-between" style="padding-top: var(--space-xl); margin-bottom: var(--space-xl);">
    <div>
      <h1 style="font-size: 2.25rem; font-weight: 800; background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Catálogo Exclusivo</h1>
      <p class="text-secondary mt-sm">Descubre las últimas tendencias y temporadas.</p>
    </div>
    
    <!-- Acciones / Filtros -->
    <div class="flex items-center gap-md">
      <!-- Filtros -->
      <div class="flex gap-sm">
        <select class="form-select" style="min-width: 150px;">
          <option value="">Todas las Categorías</option>
        </select>
      </div>
      
      <!-- Acciones de Usuario -->
      <div class="flex gap-sm border-l pl-md" style="border-left: 1px solid var(--border-subtle); padding-left: var(--space-md);">
        <ng-container *ngIf="!authService.isLoggedIn()">
          <button class="btn btn-outline" (click)="router.navigate(['/auth/login'])">Iniciar Sesión</button>
        </ng-container>
        <ng-container *ngIf="authService.isLoggedIn()">
          <!-- Botón de Cerrar Sesión si el usuario está logueado -->
          <button class="btn btn-outline text-danger" (click)="authService.logout()">Cerrar Sesión</button>
        </ng-container>

        <button class="btn btn-primary relative cart-button-anim" (click)="router.navigate(['/cart'])">
          🛒 Carrito
          <span *ngIf="cartService.totalItemsCount() > 0" class="badge badge-accent" style="position: absolute; top: -8px; right: -8px; padding: 0.2rem 0.5rem; font-size: 0.75rem; border-radius: 50%;">
            {{ cartService.totalItemsCount() }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center p-xl">
    <div class="spinner"></div>
  </div>

  <div class="grid-4" *ngIf="!loading && products.length > 0">
    <div class="card card-glass" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;" *ngFor="let prod of products">
      <!-- Imagen clickeable -->
      <div style="height: 200px; background: var(--bg-hover); position: relative; cursor: pointer;" (click)="viewProduct(prod)">
        <img *ngIf="prod.image_url" [src]="prod.image_url" alt="{{prod.name}}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <div *ngIf="!prod.image_url" class="flex justify-center items-center h-full text-muted">
          <span>Sin imagen</span>
        </div>
        <span *ngIf="prod.season" class="badge badge-primary" style="position: absolute; top: 12px; right: 12px; pointer-events: none;">{{ prod.season }}</span>
      </div>
      
      <!-- Contenido -->
      <div class="p-md flex-1 flex-col justify-between">
        <div style="cursor: pointer;" (click)="viewProduct(prod)">
          <h3 class="font-semibold text-lg mb-xs truncate hover:text-primary transition-colors">{{ prod.name }}</h3>
          <p class="text-secondary text-sm mb-md" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            {{ prod.description || 'Sin descripción disponible.' }}
          </p>
        </div>
        
        <div class="flex items-center justify-between mt-sm">
          <span class="font-bold text-xl text-primary">${{ prod.base_price.toFixed(2) }}</span>
          <button class="btn btn-accent btn-sm" (click)="viewProduct(prod)">
            👁️ Ver Detalles
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && products.length === 0" class="card card-glass text-center p-xl mt-lg">
    <div style="font-size: 3rem; margin-bottom: var(--space-md);">🛍️</div>
    <h3 class="font-semibold text-xl mb-sm">No hay productos disponibles</h3>
    <p class="text-secondary">Vuelve más tarde para ver nuestras nuevas colecciones.</p>
  </div>
</div>
