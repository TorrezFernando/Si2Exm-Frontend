server {
    listen 80;
    
    # Redirigir el tráfico del frontend a los archivos de Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es crucial para SPAs (Angular/React), redirige todas las rutas a index.html
        try_files $uri $uri/ /index.html;
    }

    # Redirigir llamadas a la API hacia el contenedor del backend
    location /api/ {
        # 'fashionstore_backend' es el nombre del contenedor del backend en la red de Docker
        proxy_pass http://fashionstore_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir llamadas a la documentación de Swagger
    location /docs {
        proxy_pass http://fashionstore_backend:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://fashionstore_backend:8000/openapi.json;
    }

    # Redirigir llamadas a las imágenes estáticas (Uploads)
    location /uploads/ {
        proxy_pass http://fashionstore_backend:8000/uploads/;
    }
}
